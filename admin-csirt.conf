# ──────────────────────────────────────────────────────────────────────────────
# Apache VirtualHost — Panel de administración Drupal (CSIRT UTPL)
# Ruta destino: /etc/apache2/sites-available/admin-csirt.conf
#
# IMPORTANTE: Este sitio debe ser accesible ÚNICAMENTE desde la VPN de Azure.
# No exponer en internet. Configurar restricción de IP en el WAF o en este bloque.
#
# Activar con:
#   a2ensite admin-csirt.conf
#   systemctl reload apache2
# ──────────────────────────────────────────────────────────────────────────────

<VirtualHost *:80>
    ServerName admin-csirt.utpl.edu.ec
    # Redirigir todo HTTP → HTTPS
    Redirect permanent / https://admin-csirt.utpl.edu.ec/
</VirtualHost>

<VirtualHost *:443>
    ServerName admin-csirt.utpl.edu.ec
    ServerAdmin csirt@utpl.edu.ec

    # ── Rutas del backend Drupal ──────────────────────────────────────────
    DocumentRoot /datos/portalesweb/csirt-headless/web

    <Directory /datos/portalesweb/csirt-headless/web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Restricción de acceso: solo red VPN Azure ─────────────────────────
    # Reemplazar con el rango CIDR real de la VPN de Azure
    <Location "/">
        Require ip 10.0.0.0/8
        # Require ip 172.16.0.0/12   # descomenta si la VPN usa este rango
    </Location>

    # ── PHP-FPM (ajustar socket según instalación) ────────────────────────
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # ── SSL ───────────────────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/admin-csirt.utpl.edu.ec.crt
    SSLCertificateKeyFile /etc/ssl/private/admin-csirt.utpl.edu.ec.key
    # SSLCertificateChainFile /etc/ssl/certs/chain.pem

    # ── Cabeceras de seguridad ────────────────────────────────────────────
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # ── Logs ──────────────────────────────────────────────────────────────
    ErrorLog  /var/log/apache2/admin-csirt-error.log
    CustomLog /var/log/apache2/admin-csirt-access.log combined
</VirtualHost>
