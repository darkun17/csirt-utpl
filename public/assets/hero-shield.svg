<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" fill="none">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60b0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#004270" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ff"/>
      <stop offset="100%" stop-color="#60b0ff"/>
    </linearGradient>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="260" cy="260" r="220" stroke="rgba(100,180,255,0.08)" stroke-width="1.5"/>
  <circle cx="260" cy="260" r="180" stroke="rgba(100,180,255,0.12)" stroke-width="1"/>

  <!-- Network nodes and connections -->
  <line x1="80" y1="120" x2="160" y2="180" stroke="rgba(100,180,255,0.3)" stroke-width="1"/>
  <line x1="440" y1="100" x2="365" y2="170" stroke="rgba(100,180,255,0.3)" stroke-width="1"/>
  <line x1="60" y1="330" x2="148" y2="295" stroke="rgba(100,180,255,0.25)" stroke-width="1"/>
  <line x1="460" y1="340" x2="372" y2="305" stroke="rgba(100,180,255,0.25)" stroke-width="1"/>
  <line x1="140" y1="430" x2="200" y2="380" stroke="rgba(100,180,255,0.2)" stroke-width="1"/>
  <line x1="380" y1="430" x2="320" y2="380" stroke="rgba(100,180,255,0.2)" stroke-width="1"/>
  <line x1="260" y1="50" x2="260" y2="120" stroke="rgba(100,180,255,0.3)" stroke-width="1"/>

  <!-- Node dots -->
  <circle cx="80" cy="120" r="5" fill="rgba(100,180,255,0.6)" filter="url(#glow)"/>
  <circle cx="440" cy="100" r="4" fill="rgba(100,180,255,0.5)" filter="url(#glow)"/>
  <circle cx="60" cy="330" r="6" fill="rgba(100,180,255,0.55)" filter="url(#glow)"/>
  <circle cx="460" cy="340" r="5" fill="rgba(100,180,255,0.5)" filter="url(#glow)"/>
  <circle cx="140" cy="430" r="4" fill="rgba(100,180,255,0.4)" filter="url(#glow)"/>
  <circle cx="380" cy="430" r="4" fill="rgba(100,180,255,0.4)" filter="url(#glow)"/>
  <circle cx="260" cy="50" r="5" fill="rgba(100,180,255,0.5)" filter="url(#glow)"/>
  <circle cx="155" cy="178" r="3" fill="rgba(100,180,255,0.6)"/>
  <circle cx="365" cy="170" r="3" fill="rgba(100,180,255,0.6)"/>
  <circle cx="148" cy="295" r="3" fill="rgba(100,180,255,0.5)"/>
  <circle cx="372" cy="305" r="3" fill="rgba(100,180,255,0.5)"/>

  <!-- Shield main shape (glow outer) -->
  <path d="M260 90 L400 138 L400 260 C400 340 340 400 260 430 C180 400 120 340 120 260 L120 138 Z"
        fill="rgba(0,100,200,0.15)" stroke="rgba(100,180,255,0.5)" stroke-width="2" filter="url(#glow2)"/>

  <!-- Shield inner fill -->
  <path d="M260 108 L385 152 L385 258 C385 330 330 385 260 412 C190 385 135 330 135 258 L135 152 Z"
        fill="rgba(0,80,180,0.25)" stroke="rgba(140,200,255,0.7)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Shield inner bright border -->
  <path d="M260 122 L372 162 L372 256 C372 322 322 372 260 396 C198 372 148 322 148 256 L148 162 Z"
        fill="none" stroke="rgba(180,220,255,0.4)" stroke-width="1"/>

  <!-- Padlock body -->
  <rect x="216" y="260" width="88" height="72" rx="10" fill="rgba(10,60,130,0.5)" stroke="url(#lockGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Padlock shackle -->
  <path d="M230 260 L230 232 C230 206 290 206 290 232 L290 260"
        fill="none" stroke="url(#lockGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Padlock keyhole -->
  <circle cx="260" cy="291" r="12" fill="rgba(140,200,255,0.7)" filter="url(#glow)"/>
  <rect x="256" y="291" width="8" height="18" rx="3" fill="rgba(140,200,255,0.7)"/>

  <!-- Horizontal glowing lines (data streams) -->
  <line x1="100" y1="200" x2="135" y2="200" stroke="rgba(100,180,255,0.4)" stroke-width="1.5"/>
  <line x1="385" y1="200" x2="420" y2="200" stroke="rgba(100,180,255,0.4)" stroke-width="1.5"/>
  <line x1="90" y1="260" x2="120" y2="260" stroke="rgba(100,180,255,0.3)" stroke-width="1"/>
  <line x1="400" y1="260" x2="430" y2="260" stroke="rgba(100,180,255,0.3)" stroke-width="1"/>

  <!-- Small decorative dots scattered -->
  <circle cx="108" cy="200" r="2.5" fill="rgba(100,180,255,0.7)"/>
  <circle cx="412" cy="200" r="2.5" fill="rgba(100,180,255,0.7)"/>
  <circle cx="96" cy="260" r="2" fill="rgba(100,180,255,0.5)"/>
  <circle cx="424" cy="260" r="2" fill="rgba(100,180,255,0.5)"/>
  <circle cx="188" cy="155" r="2" fill="rgba(100,180,255,0.4)"/>
  <circle cx="332" cy="155" r="2" fill="rgba(100,180,255,0.4)"/>

  <!-- Mail icon (small, bottom-left area) -->
  <rect x="58" y="390" width="28" height="20" rx="3" fill="none" stroke="rgba(100,180,255,0.5)" stroke-width="1.5"/>
  <path d="M58 393 L72 403 L86 393" stroke="rgba(100,180,255,0.5)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- User icon (small, top-right area) -->
  <circle cx="440" cy="160" r="8" fill="none" stroke="rgba(100,180,255,0.4)" stroke-width="1.5"/>
  <path d="M428 175 C428 168 452 168 452 175" fill="none" stroke="rgba(100,180,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Chat bubble (small, right) -->
  <rect x="440" y="220" width="32" height="22" rx="5" fill="none" stroke="rgba(100,180,255,0.35)" stroke-width="1.5"/>
  <path d="M448 242 L444 250 L456 242" fill="none" stroke="rgba(100,180,255,0.35)" stroke-width="1.2"/>
</svg>
